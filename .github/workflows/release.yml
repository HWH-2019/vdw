name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ''
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Extract version
        run: |
          VERSION=$(grep '^version' vdw/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Package binary
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)     OS=darwin; ARCH=arm64 ;;
            x86_64-apple-darwin)      OS=darwin; ARCH=x86_64 ;;
            x86_64-unknown-linux-gnu) OS=linux; ARCH=x86_64 ;;
            aarch64-unknown-linux-gnu) OS=linux; ARCH=arm64 ;;
            x86_64-pc-windows-msvc)   OS=win32; ARCH=x86_64 ;;
          esac
          ARCHIVE="vdw_${OS}_${ARCH}_${{ env.version }}"
          if [ "$OS" = "win32" ]; then
            cp target/${{ matrix.target }}/release/vdw.exe "${ARCHIVE}.exe"
            zip "${ARCHIVE}.zip" "${ARCHIVE}.exe"
            echo "artifact=${ARCHIVE}.zip" >> $GITHUB_ENV
          else
            cp target/${{ matrix.target }}/release/vdw "${ARCHIVE}"
            tar -czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
            echo "artifact=${ARCHIVE}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdw-${{ matrix.target }}
          path: vdw/${{ env.artifact }}

  build-vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
        working-directory: vdw-vscode
      - run: npm run package
        working-directory: vdw-vscode
      - name: Rename with version
        run: |
          VERSION=$(node -e "console.log(require('./vdw-vscode/package.json').version)")
          mv vdw-vscode/vdw-vscode-*.vsix "vdw_vscode_${VERSION}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vdw-vscode-vsix
          path: vdw_vscode_*.vsix

  release:
    name: Create Release
    needs: [build, build-vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          find . -name 'vdw_*' -type f | while read f; do
            sha256sum "$f" >> checksums.txt
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vdw-*/
            vdw-vscode-vsix/
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
