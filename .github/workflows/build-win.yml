name: Build Windows

on:
  push:
    branches:
      - dev_win
      - main
  pull_request:
    branches:
      - dev_win
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build embedded dashboard
        shell: bash
        run: bash scripts/build_dashboard.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        working-directory: vdw
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Smoke test installed dashboard without Node/npm
        shell: bash
        run: python scripts/smoke_dashboard.py --binary vdw/target/x86_64-pc-windows-msvc/release/vdw.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdw-windows
          path: vdw/target/x86_64-pc-windows-msvc/release/vdw.exe
