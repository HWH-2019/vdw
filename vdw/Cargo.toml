[package]
name = "vdw"
version = "0.11.1"
edition = "2021"
authors = ["VDW Team"]
description = "Declarative multi-repository Git worktree orchestration with AI context filtering"

[[bin]]
name = "vdw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
git2 = { version = "0.18", features = ["vendored-openssl"] }
tokio = { version = "1.35", features = ["full"] }
walkdir = "2.4"
glob = "0.3"
fs_extra = "1.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cfg-if = "1.0"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
sha2 = "0.10"
parking_lot = "0.12"
notify = "6.1"
atty = "0.2"
axum = "0.8"
rust-embed = { version = "8", features = ["debug-embed"] }
getrandom = "0.4"
mime_guess = "2"
tokio-stream = "0.1"
trash = "5.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3.9"
assert_fs = "1.0"
criterion = "0.5"

[build-dependencies]
sha2 = "0.10"
serde_json = "1.0"

[[bench]]
name = "link_benchmark"
harness = false
