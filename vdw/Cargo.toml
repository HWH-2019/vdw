[package]
name = "vdw"
version = "0.6.1"
edition = "2021"
authors = ["VDW Team"]
description = "Virtual Dev Workspace - Cross-repo development middleware"

[[bin]]
name = "vdw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
git2 = { version = "0.18", features = ["vendored-openssl"] }
tokio = { version = "1.35", features = ["full"] }
walkdir = "2.4"
glob = "0.3"
fs_extra = "1.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cfg-if = "1.0"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
sha2 = "0.10"
parking_lot = "0.12"
notify = "6.1"
atty = "0.2"

[dev-dependencies]
tempfile = "3.9"
assert_fs = "1.0"
criterion = "0.5"

[[bench]]
name = "link_benchmark"
harness = false
